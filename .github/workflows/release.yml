---
name: release

# Branch-driven release model:
#
#   1. Bump `version` in pyproject.toml on the release branch.
#   2. From the GitHub Actions UI, open this workflow and click
#      "Run workflow", choosing target=testpypi first.
#   3. Smoke-install from TestPyPI in a throwaway venv. Only then
#      re-run the workflow with target=pypi.
#
# tt_symbiote does NOT use git tags. The release branch (currently
# `transformers5.9.0`) IS the release marker. See
# `docs/development/release_process.md` for the full recipe.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: install build tooling
        run: python -m pip install --upgrade build twine
      - name: build distributions
        run: python -m build
      - name: validate metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: smoke install
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: install built wheel
        # ttnn is NOT a dependency of the wheel (it is source-build-only), so
        # this install pulls only the real, ttnn-free dependency graph that a
        # PyPI user gets — and crucially can never overwrite a source-built ttnn.
        run: python -m pip install dist/*.whl
      - name: import tt_symbiote (ttnn pre-stubbed; CI has no sfpi)
        run: |
          python - <<'PY'
          import sys
          from unittest.mock import MagicMock
          # ttnn is NOT installed by the wheel above. We pre-stub
          # `sys.modules["ttnn"]` so the import guard in tt_symbiote's
          # __init__ (which treats a sys.modules entry as "ttnn present")
          # is satisfied without a real build: the GitHub Actions runner
          # has no /opt/tenstorrent/sfpi/ toolchain, so letting a real
          # ttnn load would either crash at import-time (looking up sfpi
          # paths) or, if it survived import, crash at first
          # `open_mesh_device(...)`. The goal of the smoke step is to
          # catch packaging errors (missing files, broken
          # from_pretrained imports, syntax errors at module load),
          # not to validate the runtime — the runtime is validated by
          # the post-publish e2e demos run on real Tenstorrent silicon.
          # MagicMock (vs types.ModuleType) is required so eager
          # attribute accesses at module load time (e.g. `ttnn.float32`
          # in tt_symbiote.core.utils) get a usable, hashable placeholder.
          # tracy does not need stubbing — tt_symbiote.core.run_config
          # falls back to a no-op signpost shim when tracy is missing.
          for name in ("ttnn", "ttnn.model_preprocessing", "ttnn.distributed"):
              sys.modules[name] = MagicMock()

          import tt_symbiote
          assert hasattr(tt_symbiote, "AutoModelForCausalLM"), \
              "AutoModelForCausalLM not re-exported"
          assert hasattr(tt_symbiote, "set_device"), \
              "set_device not re-exported"
          version = tt_symbiote.__version__
          assert version != "0.0.0+unknown", \
              "__version__ should come from package metadata after install"
          print(f"tt_symbiote {version} imported OK")
          PY

  publish-testpypi:
    name: publish to TestPyPI
    needs: smoke
    if: github.event.inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write    # OIDC Trusted Publisher
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: publish to PyPI
    needs: smoke
    if: github.event.inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write    # OIDC Trusted Publisher
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
