[build-system]
requires = [
  "setuptools==70.1.0",
  "setuptools-scm==8.1.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "tt_symbiote"
authors = [
    {name = "Tenstorrent"},
    {email = "info@tenstorrent.com"},
]
description = "Hugging Face of Tenstorrent: pip-installable TTNN-accelerated drop-in for transformers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["tenstorrent", "ttnn", "transformers", "huggingface", "tt-metal", "machine learning"]
dynamic = ["version"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Pinning policy (per PROJECT_PROPOSAL.md §10):
#
# - `transformers` is pinned to a single EXACT version per tt_symbiote branch.
#   Different transformers versions can ship model code or config schemas that
#   are mutually incompatible; the strict `==` is what guarantees the modeling
#   files in src/tt_symbiote/models/<model>/ stay coherent with the
#   transformers release we vendored against.
#
# - Every other dependency below MIRRORS THE SPECIFIER USED BY transformers
#   v5.9.0 verbatim (see https://github.com/huggingface/transformers/blob/v5.9.0/setup.py).
#   Hugging Face themselves use lower-bound / capped-range pins, not exact pins,
#   to stay compatible with the platform-specific wheel sets of torch / numpy /
#   tokenizers / etc. We deliberately do not tighten these further, since doing
#   so would create resolver conflicts against `transformers==5.9.0`.
#
# - `torch` is promoted from HF's optional `torch` extra into our hard deps
#   (tt_symbiote always imports it). Same goes for `accelerate`, which HF pairs
#   with torch in that extra.
#
# - `loguru` is tt_symbiote-specific (not in HF) and is needed by the vendored
#   arch helpers in src/tt_symbiote/core/arch.py.
#
# - `ttnn` IS published on PyPI (https://pypi.org/project/ttnn/) but is
#   deliberately NOT declared here. Each `ttnn` wheel embeds a specific
#   sfpi RISC-V toolchain version inside `ttnn/tt_metal/sfpi-version`,
#   and JIT-compiles firmware kernels at first device-open time using
#   the system-installed `riscv-tt-elf-g++`. If the system sfpi at
#   `/opt/tenstorrent/sfpi/` doesn't match the wheel's pin, every
#   `open_mesh_device(...)` call fails with "unrecognized command-line
#   option". So a blanket `pip install tt_symbiote` cannot safely
#   resolve `ttnn` for the user — `pip` would happily install a wheel
#   whose sfpi pin disagrees with the host. Instead we ship a thin
#   bootstrap (`scripts/bootstrap_venv.sh`) that reads
#   `scripts/ttnn-pin.txt`, probes the system sfpi, and installs the
#   matching ttnn version. This mirrors how HF transformers leaves CUDA
#   wheels to the user: the hardware backend is system-prerequisite,
#   not pip-resolvable.
#
# - `tracy` is also NOT declared. It's tt-metal-built and only needed
#   for performance work.
dependencies = [
  # tt_symbiote-specific pin
  "transformers==5.9.0",
  # Mirror of transformers v5.9.0's `extras["torch"]` (required for us)
  "torch>=2.4",
  "accelerate>=1.1.0",
  # Mirror of transformers v5.9.0's `install_requires`
  "huggingface-hub>=1.5.0,<2.0",
  "numpy>=1.17",
  "packaging>=20.0",
  "pyyaml>=5.1",
  "regex>=2025.10.22",
  "tokenizers>=0.22.0,<=0.23.0",
  "typer",
  "safetensors>=0.4.3",
  "tqdm>=4.27",
  # tt_symbiote-specific extra (vendored arch helpers)
  "loguru>=0.6.0",
]

[project.optional-dependencies]
# UX-convenience extra for users whose system sfpi already matches the pin
# below. `pip install "tt_symbiote[ttnn]"` pulls the exact ttnn wheel that
# Phase-8 demos are validated against. The pin here MUST stay in lockstep
# with `scripts/ttnn-pin.txt` (canonical source of truth: the bootstrap
# script reads it to probe the system sfpi).
#
# IMPORTANT: this extra is intentionally NOT in the hard `dependencies`
# above. Picking the wrong ttnn for the host's sfpi makes every
# `open_mesh_device(...)` fail with "unrecognized command-line option".
# Users without a matching sfpi should either install ttnn manually after
# verifying the pair (see `docs/install_prerequisites.md`) or use
# `scripts/bootstrap_venv.sh`, which validates the sfpi *before* pip-
# installing.
ttnn = [
  "ttnn==0.68.0",
]
dev = [
  "pre-commit",
  "pytest",
  "pytest-xdist",
  "black==23.10.1",
  "isort==5.13.2",
  "autoflake==2.3.1",
  "ruff",
  "yamllint==1.35.1",
  # Release tooling — matches `make dist` and `docs/release_process.md`'s
  # pre-tag gate (`python -m build && twine check dist/*`).
  "build>=1.0",
  "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/alnah005/tt_symbiote"
Repository = "https://github.com/alnah005/tt_symbiote"
Issues = "https://github.com/alnah005/tt_symbiote/issues"

[tool.setuptools.packages.find]
where = ["src"]

# Keep migration-era backups (`*.bak`, `*.orig`) out of the published
# sdist/wheel. They live next to live modules for traceability but are
# not part of the runtime surface.
[tool.setuptools.exclude-package-data]
"*" = ["*.bak", "*.orig", "*.rej", "*~"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"
tag_regex = '^(?:v)?(?P<version>\d+\.\d+\.\d+(?:-rc\d+)?)$'
git_describe_command = [
  "git", "describe", "--dirty", "--tags", "--long",
  "--match", "v[0-9]*.[0-9]*.[0-9]*",
  "--match", "v[0-9]*.[0-9]*.[0-9]*-rc[0-9]*",
  "--exclude", "*-dev*",
]

[tool.black]
line-length = 120
include = '^(src|tests|examples|scripts)/.*\.py$'

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
skip = ["__init__.py"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
