[build-system]
requires = [
  "setuptools==70.1.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "tt_symbiote"
# Versioning policy: literal, branch-driven.
#
# The release branch (`transformers5.9.0`) IS the release marker —
# tt_symbiote does NOT use git tags. To cut a new release, bump this
# version in a one-line commit on the release branch, push, then
# trigger the publish workflow (`workflow_dispatch`) from the GitHub
# Actions UI. See `docs/development/release_process.md`.
#
# `setuptools-scm` is intentionally NOT used: with no tags it falls
# back to noisy `0.0.1.dev<n>+<sha>` strings that PyPI rejects as
# pre-releases. The literal pin below is the source of truth that
# `importlib.metadata.version("tt_symbiote")` returns.
version = "0.1.5"
authors = [
    {name = "Tenstorrent"},
    {email = "info@tenstorrent.com"},
]
description = "Hugging Face of Tenstorrent: pip-installable TTNN-accelerated drop-in for transformers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["tenstorrent", "ttnn", "transformers", "huggingface", "tt-metal", "machine learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Pinning policy:
#
# - `transformers` is pinned to a single EXACT version per tt_symbiote branch.
#   Different transformers versions can ship model code or config schemas that
#   are mutually incompatible; the strict `==` is what guarantees the modeling
#   files in src/tt_symbiote/models/<model>/ stay coherent with the
#   transformers release we vendored against.
#
# - Every other dependency below MIRRORS THE SPECIFIER USED BY transformers
#   v5.9.0 verbatim (see https://github.com/huggingface/transformers/blob/v5.9.0/setup.py).
#   Hugging Face themselves use lower-bound / capped-range pins, not exact pins,
#   to stay compatible with the platform-specific wheel sets of torch / numpy /
#   tokenizers / etc. We deliberately do not tighten these further, since doing
#   so would create resolver conflicts against `transformers==5.9.0`.
#
# - `torch` is promoted from HF's optional `torch` extra into our hard deps
#   (tt_symbiote always imports it). Same goes for `accelerate`, which HF pairs
#   with torch in that extra.
#
# - `loguru` is tt_symbiote-specific (not in HF) and is needed by the vendored
#   arch helpers in src/tt_symbiote/core/arch.py.
#
# - `ttnn` is DELIBERATELY NOT a dependency. ttnn is a compiled extension tied to
#   a specific tt-metal commit; each tt_symbiote recipe is verified against its
#   own `tt_metal_commit` (metadata in `RUNTIME_PINS`, enforced at runtime by the
#   compatibility gate). The only correct ttnn is the one built from source at
#   that commit, so we must NEVER let `pip install tt_symbiote` pull a PyPI ttnn
#   wheel over the source build. Install ttnn yourself by building tt-metal at the
#   model's pinned commit (see the Installation section of the README); a clear
#   error is raised at import if ttnn is absent. `RELEASE_TTNN` in
#   `src/tt_symbiote/models/_runtime_pins.py` is kept only as provenance for the
#   runtime gate — it is NOT installed. Software-only collection under
#   `tests/auto/` does NOT need ttnn (its conftest installs sys.modules stubs).
#
# - `tracy` is NOT declared. It's tt-metal-built and only needed for
#   performance work; `tt_symbiote/core/run_config.py` already falls
#   back to a no-op signpost shim when it's missing.
dependencies = [
  # tt_symbiote-specific pin
  "transformers==5.9.0",
  # NOTE: ttnn is intentionally absent here -- it must be source-built from each
  # model's pinned tt-metal commit, never pip-installed. See the dependency note
  # above.
  # Mirror of transformers v5.9.0's `extras["torch"]` (required for us)
  "torch>=2.4",
  "accelerate>=1.1.0",
  # Mirror of transformers v5.9.0's `install_requires`
  "huggingface-hub>=1.5.0,<2.0",
  "numpy>=1.17",
  "packaging>=20.0",
  "pyyaml>=5.1",
  "regex>=2025.10.22",
  "tokenizers>=0.22.0,<=0.23.0",
  "typer",
  "safetensors>=0.4.3",
  "tqdm>=4.27",
  # tt_symbiote-specific extra (vendored arch helpers)
  "loguru>=0.6.0",
]

[project.optional-dependencies]
# >>> ttnn-extras (generated by scripts/sync_ttnn_extras.py) >>>
# Shared per-capability extras (à la transformers). Models opt in via
# RUNTIME_PINS[...]['extras']. Per-model tt-metal commits are metadata in
# _runtime_pins.py, NOT pip deps (one ttnn per env). Regenerate with
# `python scripts/sync_ttnn_extras.py`.
qwen-vl = ["qwen-vl-utils"]
vision = ["torchvision"]
all = ["qwen-vl-utils", "torchvision"]
# <<< ttnn-extras <<<
dev = [
  "pre-commit",
  "pytest",
  "pytest-xdist",
  "black==23.10.1",
  "isort==5.13.2",
  "autoflake==2.3.1",
  "ruff",
  "yamllint==1.35.1",
  # Release tooling — matches `make dist` and `docs/development/release_process.md`'s
  # pre-tag gate (`python -m build && twine check dist/*`).
  "build>=1.0",
  "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/alnah005/tt_symbiote"
Repository = "https://github.com/alnah005/tt_symbiote"
Issues = "https://github.com/alnah005/tt_symbiote/issues"

[tool.setuptools.packages.find]
where = ["src"]
# `_experimental/` holds unregistered modeling code that survives from
# earlier phases. It is NOT shipped to PyPI users; see
# src/tt_symbiote/_experimental/__init__.py.
exclude = ["tt_symbiote._experimental*"]

# Keep migration-era backups (`*.bak`, `*.orig`) out of the published
# sdist/wheel. They live next to live modules for traceability but are
# not part of the runtime surface.
[tool.setuptools.exclude-package-data]
"*" = ["*.bak", "*.orig", "*.rej", "*~"]

[tool.black]
line-length = 120
include = '^(src|tests|examples|scripts)/.*\.py$'

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
skip = ["__init__.py"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# Collected by default (see `testpaths` below):
#   - tests/auto/    software-only tests (no hardware; ttnn deferred/mocked)
#   - tests/shared/  shared helpers (pcc_utils, shared_configs) + shared
#                    capability tests (attention/conv/moe/rope/dpl)
# NOT auto-collected (documented tree, currently empty this session):
#   - tests/models/  RICH per-model dirs (e2e-traced-correct) — not in `testpaths`;
#                    run explicitly when populated.
# `tests/experimental/` is deliberately excluded (see tests/experimental/README.md)
# — those tests target models whose `src/tt_symbiote/models/<name>/` package is
# NOT in the supported `_RECIPE_BEARING_SUBPACKAGES` registry and are not
# guaranteed to import.
testpaths = ["tests/auto", "tests/shared"]
addopts = "-q --ignore=tests/experimental"
